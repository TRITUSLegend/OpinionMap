<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>OpinionMap: what the internet thinks, mapped</title>
    <meta name="description" content="Type a topic and OpinionMap's agents gather public opinion from Reddit, Hacker News, YouTube, news sites and more, analyse sentiment and themes, and write you a report." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpinionMap" />
    <meta property="og:title" content="OpinionMap: what the internet thinks, mapped" />
    <meta property="og:description" content="Multi-agent opinion research: public sentiment and themes from multiple sources, summarised into a report." />
    <meta property="og:url" content="https://opinionmap.netlify.app/" />
    <meta name="twitter:card" content="summary" />
    <script>
      // Apply the saved theme (or the OS preference) before first paint, so the
      // page never flashes the wrong theme. ThemeProvider takes over from here.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.toggle('dark', theme === 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
